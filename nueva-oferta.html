<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de la codificación de caracteres a UTF-8 para admitir tildes y eñes -->
    <meta charset="UTF-8">
    
    <!-- Adaptabilidad responsive para dispositivos móviles y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título específico de la vista de nueva oferta -->
    <title>Nueva Oferta - TandemLink</title>
    
    <!-- Importación del framework CSS Bootstrap 5 mediante CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Hoja de estilos propia -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- BARRA DE NAVEGACIÓN PRINCIPAL              -->
    <!-- ========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-azul-tandem mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TandemLink</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="intercambios.html">Intercambios</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="nueva-oferta.html">Nueva Oferta</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
                    
                    <!-- ID CLAVE: Inyección dinámica de la sesión -->
                    <li class="nav-item ms-lg-3" id="infoUsuarioNav"></li>
                </ul>
            </div>
        </div>
    </nav>


    <!-- ========================================== -->
    <!-- CONTENEDOR PRINCIPAL: FORMULARIO           -->
    <!-- ========================================== -->
    <div class="container animacion-entrada py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <h1 class="texto-titulo mb-1 text-center">Publicar Intercambio</h1>
                <p class="texto-subtitulo mb-4 text-center">Crea una oferta o petición para encontrar tu compañero ideal.</p>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Contenedor de alertas -->
                        <div id="mensajeIntercambio"></div>

                        <!-- Formulario de registro de intercambio -->
                        <form id="formularioIntercambio">
                            
                            <!-- Tipo de intercambio -->
                            <div class="mb-3">
                                <label for="tipoIntercambio" class="form-label texto-subtitulo">Tipo de anuncio</label>
                                <select class="form-select" id="tipoIntercambio" required>
                                    <option value="oferta">Oferta (Ofrezco enseñar un idioma)</option>
                                    <option value="petición">Petición (Busco aprender un idioma)</option>
                                </select>
                            </div>

                            <!-- Usuario que publica -->
                            <div class="mb-3">
                                <label for="usuarioIntercambio" class="form-label texto-subtitulo">Usuario que publica</label>
                                <select class="form-select" id="usuarioIntercambio" required>
                                    <!-- Los usuarios se cargarán dinámicamente desde JavaScript -->
                                </select>
                            </div>

                            <!-- Idioma ofrecido -->
                            <div class="mb-3">
                                <label for="idiomaOfrecido" class="form-label texto-subtitulo">Idioma ofrecido</label>
                                <input type="text" class="form-control" id="idiomaOfrecido" placeholder="Ej. Español" required>
                            </div>

                            <!-- Idioma buscado -->
                            <div class="mb-3">
                                <label for="idiomaBuscado" class="form-label texto-subtitulo">Idioma buscado</label>
                                <input type="text" class="form-control" id="idiomaBuscado" placeholder="Ej. Inglés" required>
                            </div>

                            <!-- Modalidad -->
                            <div class="mb-3">
                                <label for="modalidadIntercambio" class="form-label texto-subtitulo">Modalidad</label>
                                <select class="form-select" id="modalidadIntercambio" required>
                                    <option value="Presencial">Presencial</option>
                                    <option value="Online">Online</option>
                                </select>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-4">
                                <label for="descripcionIntercambio" class="form-label texto-subtitulo">Descripción</label>
                                <textarea class="form-control" id="descripcionIntercambio" rows="3" placeholder="Breve detalle sobre lo que buscas..." required></textarea>
                            </div>

                            <!-- Botón de envío -->
                            <button type="submit" class="btn btn-primary bg-azul-tandem border-0 w-100 py-2 fw-semibold">
                                Publicar anuncio
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/intercambios.js"></script>
    <script type="module" src="js/navegacion.js"></script>
</body>
</html>
