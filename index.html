   DOCUMENTACIÓN IA GENERATIVA
   - IA utilizada: Gemini
   - Prompt 1: "Crea la estructura HTML principal utilizando Bootstrap 5 con una barra de navegación superior y enlaces responsive."
   - Prompt 2: "Diseña la sección de cabecera (header) con títulos llamativos y un botón centrado para explorar los intercambios."
   - Prompt 3: "Añade un contenedor con selectores desplegables (filtros por tipo y orden cronológico por fechas) para el dashboard."
   - Prompt 4: "Configura la inserción de los scripts de JavaScript en formato de módulo para el dashboard y la navegación."
   ========================================================================== -->


<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TandemLink | Intercambio de idiomas</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Nuestros estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                TandemLink
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Mostrar navegación"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nueva-oferta.html">Intercambios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="usuarios.html">Usuarios</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Presentación -->
    <header class="container py-5 text-center">
        <h1 class="display-5 fw-bold">Aprende idiomas compartiendo</h1>

        <p class="lead mt-3">
            Encuentra personas con las que practicar idiomas
            y comparte los que ya dominas.
        </p>

        <a href="nueva-oferta.html" class="btn btn-primary btn-lg mt-2">
            Explorar intercambios
        </a>
    </header>

    <!-- Dashboard -->
    <main class="container pb-5">

        <div class="mb-4">
            <h2 class="h3 mb-3">Intercambios disponibles</h2>

            <!-- Filtros del dashboard -->
            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label for="filtroTipo" class="form-label">
                        Tipo de intercambio
                    </label>

                    <select id="filtroTipo" class="form-select">
                        <option value="todos">Todos</option>
                        <option value="oferta">Ofertas</option>
                        <option value="petición">Peticiones</option>
                    </select>
                </div>

                <div class="col-12 col-md-6">
                    <label for="ordenFecha" class="form-label">
                        Ordenar por fecha
                    </label>

                    <select id="ordenFecha" class="form-select">
                        <option value="recientes" selected>
                            Más recientes primero
                        </option>
                        <option value="antiguos">
                            Más antiguos primero
                        </option>
                    </select>
                </div>

            </div>
        </div>

        <div class="row g-4" id="contenedorIntercambios">
            <!-- JavaScript insertará aquí las tarjetas -->
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="bg-light border-top py-4">
        <div class="container text-center">
            <p class="mb-0 text-secondary">
                TandemLink · Proyecto educativo de intercambio de idiomas
            </p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript: menú móvil -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JavaScript del dashboard -->
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/navegacion.js"></script>

</body>
</html>
