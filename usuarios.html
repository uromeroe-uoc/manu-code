<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de usuarios | TandemLink</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                TandemLink
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Mostrar navegación"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nueva-oferta.html">Intercambios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="usuarios.html">Usuarios</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- Encabezado -->
        <header class="mb-4">
            <h1 class="fw-bold">Gestión de usuarios</h1>
            <p class="text-secondary">
                Registra usuarios y consulta las personas que forman parte de TandemLink.
            </p>
        </header>

        <!-- Formulario de alta -->
        <section class="card shadow-sm border-0 mb-5">
            <div class="card-body p-4">
                <h2 class="h4 mb-4">Registrar nuevo usuario</h2>

                <form id="formularioUsuario">

                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="nombre" class="form-label">
                                Nombre completo
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="emailUsuario" class="form-label">
                                Correo electrónico
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="emailUsuario"
                                name="email"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="passwordUsuario" class="form-label">
                                Contraseña
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="passwordUsuario"
                                name="password"
                                minlength="4"
                                required
                            >
                        </div>
                    </div>

                    <div id="mensajeUsuario"
                         class="mt-3"
                         role="alert"
                         aria-live="polite">
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">
                        Registrar usuario
                    </button>

                </form>
            </div>
        </section>

        <!-- Listado de usuarios -->
        <section>
            <h2 class="h4 mb-3">Usuarios registrados</h2>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Correo electrónico</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="listaUsuarios">
                        <!-- JavaScript insertará aquí los usuarios -->
                    </tbody>
                </table>
            </div>

            <p id="mensajeListaVacia" class="text-secondary"></p>
        </section>

    </main>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JavaScript de gestión de usuarios -->
    <script type="module" src="js/usuarios.js"></script>
    <script type="module" src="js/navegacion.js"></script>

</body>
</html>
