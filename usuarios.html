<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de la codificación de caracteres a UTF-8 para admitir tildes y eñes -->
    <meta charset="UTF-8">
    
    <!-- Adaptabilidad responsive para dispositivos móviles y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Gestión de Usuarios - TandemLink</title>
    
    <!-- Importación del framework CSS Bootstrap 5 mediante CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Hoja de estilos propia (tipografía Poppins, colores corporativos y animaciones) -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN PRINCIPAL -->
    <!-- navbar-expand-lg: despliega el menú en pantallas grandes; bg-azul-tandem: color personalizado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-azul-tandem mb-4 py-3">
        <div class="container">
            <!-- Logotipo o marca de la plataforma -->
            <a class="navbar-brand fw-bold" href="#">TandemLink</a>
            
            <!-- Botón para pantallas pequeñas (móviles) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Contenedor colapsable del menú -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="intercambios.html">Intercambios</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="usuarios.html">Usuarios</a></li>
                    
                    <!-- ID CLAVE: Aquí el script 'navegacion.js' inyectará dinámicamente el nombre del usuario conectado -->
                    <li class="nav-item ms-lg-3" id="infoUsuarioNav"></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DE LA VISTA -->
    <!-- container: centra el contenido y limita el ancho; animacion-entrada: clase propia para la transición -->
    <div class="container animacion-entrada">
        
        <!-- Títulos descriptivos de la sección -->
        <h1 class="texto-titulo mb-1">Gestión de usuarios</h1>
        <p class="texto-subtitulo mb-4">Registra usuarios y consulta las personas que forman parte de TandemLink.</p>

        <!-- TARJETA DEL FORMULARIO DE REGISTRO -->
        <!-- card: componente de Bootstrap con sombra (shadow-sm) y sin bordes (border-0) -->
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-body p-4">
                <h5 class="card-title mb-4 fw-bold">Registrar nuevo usuario</h5>
                
                <!-- Contenedor vacío donde el JavaScript inyectará las alertas visuales de éxito o error -->
                <div id="mensajeUsuario"></div>

                <!-- Formulario principal con ID para controlarlo desde JavaScript -->
                <form id="formularioUsuario">
                    <!-- Sistema de rejilla (row) con separación (g-3) -->
                    <div class="row g-3 mb-4">
                        <!-- Campo 1: Nombre completo (ocupa 4 columnas en pantallas medianas) -->
                        <div class="col-md-4">
                            <label class="form-label texto-subtitulo">Nombre completo</label>
                            <!-- ID exacto requerido por el script JS para capturar el valor -->
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        
                        <!-- Campo 2: Correo electrónico -->
                        <div class="col-md-4">
                            <label class="form-label texto-subtitulo">Correo electrónico</label>
                            <!-- ID exacto para validar duplicados en el array -->
                            <input type="email" class="form-control" id="emailUsuario" required>
                        </div>
                        
                        <!-- Campo 3: Contraseña -->
                        <div class="col-md-4">
                            <label class="form-label texto-subtitulo">Contraseña</label>
                            <!-- ID exacto para recoger el password al registrar -->
                            <input type="password" class="form-control" id="passwordUsuario" required>
                        </div>
                    </div>
                    
                    <!-- Botón de envío del formulario vinculado al evento 'submit' -->
                    <button type="submit" class="btn btn-primary bg-azul-tandem border-0 px-4 py-2">Registrar usuario</button>
                </form>
            </div>
        </div>

        <!-- SECCIÓN DE LA TABLA DE USUARIOS REGISTRADOS -->
        <h5 class="mb-3 fw-bold">Usuarios registrados</h5>
        
        <!-- table-responsive: permite scroll horizontal en móviles si la tabla es muy ancha -->
        <div class="table-responsive bg-white shadow-sm border-0 rounded-3">
            <table class="table mb-0 table-hover">
                <!-- Cabecera de la tabla con estilo personalizado -->
                <thead class="cabecera-tabla-azul">
                    <tr>
                        <th scope="col" class="py-3 px-4">ID</th>
                        <th scope="col" class="py-3">Nombre</th>
                        <th scope="col" class="py-3">Correo electrónico</th>
                        <th scope="col" class="py-3">Acciones</th>
                    </tr>
                </thead>
                
                <!-- CUERPO DE LA TABLA -->
                <!-- ID CLAVE: El archivo 'usuarios.js' utiliza este <tbody> para crear y añadir las filas (<tr>) mediante bucles -->
                <tbody id="listaUsuarios">
                    <!-- Las filas de datos se cargan dinámicamente desde JavaScript -->
                </tbody>
            </table>
            
            <!-- Párrafo para mostrar un aviso visual en caso de que la lista de usuarios se quede vacía -->
            <p id="mensajeListaVacia" class="text-center p-4 mb-0 texto-subtitulo"></p>
        </div>

    </div> <!-- Fin del contenedor principal -->

    <!-- SCRIPTS DE JAVASCRIPT Y LÓBRICA -->
    
    <!-- 1. Bootstrap Bundle: incluye Popper para los componentes interactivos (como el menú desplegable) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 2. Script principal de la página con type="module" para permitir importaciones (import/export) -->
    <script type="module" src="js/usuarios.js"></script>
</body>
</html>
