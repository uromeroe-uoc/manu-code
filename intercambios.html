<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de la codificación de caracteres a UTF-8 para admitir tildes y eñes -->
    <meta charset="UTF-8">
    
    <!-- Adaptabilidad responsive para dispositivos móviles y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título principal de la página de bienvenida -->
    <title>Inicio - TandemLink</title>
    
    <!-- Importación del framework CSS Bootstrap 5 mediante CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Hoja de estilos propia (tipografía Poppins, colores corporativos y animaciones) -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- BARRA DE NAVEGACIÓN PRINCIPAL              -->
    <!-- ========================================== -->
    <!-- navbar-expand-lg: despliega el menú en pantallas grandes; bg-azul-tandem: color corporativo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-azul-tandem mb-4 py-3">
        <div class="container">
            <!-- Logotipo o marca de la plataforma, enlazado al propio inicio -->
            <a class="navbar-brand fw-bold" href="index.html">TandemLink</a>
            
            <!-- Botón de hamburguesa para pantallas pequeñas (móviles) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Contenedor colapsable del menú de navegación -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                   
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                     <!-- Añadimos 'active fw-bold' en Inicio para indicar visualmente en qué página estamos -->
                    <li class="nav-item"><a class="nav-link" active fw-bold href="intercambios.html">Intercambios</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
                    
                    <!-- ID CLAVE: Aquí el script 'navegacion.js' inyectará dinámicamente el nombre del usuario conectado -->
                    <li class="nav-item ms-lg-3" id="infoUsuarioNav"></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container animacion-entrada">
        
        <!-- Títulos de la sección -->
        <h1 class="texto-titulo mb-1">Intercambios de idiomas</h1>
        <p class="texto-subtitulo mb-4">Explora las ofertas y peticiones de la comunidad para practicar nuevos idiomas.</p>

        <!-- CONTENEDOR DE TARJETAS DE INTERCAMBIO -->
        <!-- ID CLAVE: Aquí es donde el JavaScript inyectará dinámicamente las tarjetas con los intercambios -->
        <div class="row g-4" id="contenedorIntercambios">
            <!-- Las tarjetas de ofertas/peticiones se cargan mediante JavaScript desde datos.js -->
        </div>

        <!-- Aviso en caso de que no haya intercambios disponibles -->
        <p id="mensajeIntercambiosVacio" class="text-center p-4 mb-0 texto-subtitulo"></p>

    </div> <!-- Fin del contenedor principal -->


    <!-- ========================================== -->
    <!-- SCRIPTS DE JAVASCRIPT                      -->
    <!-- ========================================== -->
    
    <!-- 1. Bootstrap Bundle: componentes interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 2. Script específico de la lógica de intercambios con type="module" -->
    <script type="module" src="js/intercambios.js"></script>
</body>
</html>
